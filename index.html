<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Minhas Contas"><meta name="theme-color" content="#111827"><title>Minhas Contas</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:680px;margin:auto;padding:22px 14px 90px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{margin:0;font-size:29px}.top p{margin:3px 0;color:#6b7280;font-size:13px}select,input{border:1px solid #ddd;border-radius:12px;padding:11px;background:#fff;font-size:16px}.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.box{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:13px}.box:last-child{grid-column:1/-1}.box small{color:#6b7280}.box b{display:block;font-size:19px;margin-top:4px}.bar{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin:10px 0 15px}.bar i{display:block;height:100%;background:#16a34a}.tools{display:flex;gap:7px;overflow:auto;margin-bottom:12px}button{border:0;border-radius:12px;padding:10px 12px;background:#111827;color:#fff;font-weight:700;white-space:nowrap}button.light{background:#fff;color:#111827;border:1px solid #ddd}button.red{background:#fee2e2;color:#991b1b}.list{display:grid;gap:8px}.bill{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:12px;display:grid;grid-template-columns:45px 1fr auto;gap:9px}.day{width:45px;height:45px;border-radius:12px;background:#f1f5f9;display:grid;place-items:center;font-weight:800}.paid .day{background:#dcfce7;color:#166534}.name{font-weight:800}.meta,.status{font-size:11px;color:#6b7280;margin-top:3px}.paid .status{color:#15803d;font-weight:700}.open .status{color:#dc2626;font-weight:700}.amt{text-align:right;font-weight:800}.acts{display:flex;gap:5px;margin-top:7px}.acts button{font-size:11px;padding:6px 8px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:#fffffff2;border-top:1px solid #ddd}.bottom button{width:100%;font-size:16px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:680px;margin:auto;border-radius:22px 22px 0 0;padding:20px}.sheet h2{margin:0 0 14px}.sheet label{display:block;color:#6b7280;font-size:12px;margin:9px 0}.sheet input{width:100%;margin-top:4px}.row{display:flex;gap:8px;margin-top:14px}@media(max-width:430px){.bill{grid-template-columns:42px 1fr}.day{width:42px;height:42px}.amt{grid-column:2;text-align:left}}</style><body><main class="app"><div class="top"><div><h1>Minhas Contas</h1><p>Controle mensal simples</p></div><select id="mes"></select></div><div class="sum"><div class="box"><small>Total</small><b id="total">R$ 0,00</b></div><div class="box"><small>Pago</small><b id="pago">R$ 0,00</b></div><div class="box"><small>Em aberto</small><b id="aberto">R$ 0,00</b></div></div><div class="bar"><i id="barra"></i></div><div class="tools"><button onclick="novo()">＋ Nova conta</button><button class="light" onclick="copiar()">Copiar mês anterior</button></div><div id="lista" class="list"></div></main><div class="bottom"><button onclick="novo()">＋ Adicionar conta</button></div><div id="modal" class="modal"><div class="sheet"><h2 id="titulo">Nova conta</h2><label>Conta<input id="nome" placeholder="Ex.: Aluguel"></label><label>Dia<input id="dia" type="number" min="1" max="31"></label><label>Valor<input id="valor" type="number" min="0" step=".01"></label><div class="row"><button onclick="salvar()">Salvar</button><button class="light" onclick="fechar()">Cancelar</button></div></div></div><script>const nomes=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],K='minhas_contas';let db=JSON.parse(localStorage.getItem(K)||'{}'),edit=-1;nomes.forEach((n,i)=>mes.innerHTML+=`<option value="${i+1}">${n}</option>`);mes.value=8;if(!db[8])db[8]=[['Congas',3,80,1],['Estacionamento',8,66,1],['Casas Bahia',10,140,1],['Tim',15,120,1],['Acordo Santander',19,135,1],['Aluguel',21,2044,1],['Nu bank',22,150,1],['Enel',24,129,0],['Seguro do carro',26,86,0],['Cartão',27,2200,0],['Faculdade',31,144,0]].map(x=>({n:x[0],d:x[1],v:x[2],p:!!x[3]}));function save(){localStorage.setItem(K,JSON.stringify(db))}function br(x){return (+x).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function render(){let a=(db[mes.value]||[]).sort((x,y)=>x.d-y.d),t=a.reduce((s,x)=>s+x.v,0),p=a.filter(x=>x.p).reduce((s,x)=>s+x.v,0);total.textContent=br(t);pago.textContent=br(p);aberto.textContent=br(t-p);barra.style.width=(t?p/t*100:0)+'%';lista.innerHTML=a.map((x,i)=>`<div class="bill ${x.p?'paid':'open'}"><div class="day">${String(x.d).padStart(2,'0')}</div><div><div class="name">${x.n}</div><div class="meta">Vencimento dia ${x.d}</div><div class="acts"><button class="light" onclick="pagar(${i})">${x.p?'↩ Reabrir':'✓ Marcar pago'}</button><button class="light" onclick="editar(${i})">Editar</button><button class="red" onclick="excluir(${i})">Excluir</button></div></div><div class="amt">${br(x.v)}<div class="status">${x.p?'PAGO':'EM ABERTO'}</div></div></div>`).join('');save()}function novo(){edit=-1;titulo.textContent='Nova conta';nome.value='';dia.value='';valor.value='';modal.classList.add('show')}function editar(i){edit=i;let x=db[mes.value][i];titulo.textContent='Editar conta';nome.value=x.n;dia.value=x.d;valor.value=x.v;modal.classList.add('show')}function salvar(){if(!nome.value||!dia.value||valor.value===''){alert('Preencha conta, dia e valor.');return}let x={n:nome.value,d:+dia.value,v:+valor.value,p:false};if(edit>=0)x.p=db[mes.value][edit].p,db[mes.value][edit]=x;else db[mes.value].push(x);fechar();render()}function fechar(){modal.classList.remove('show')}function pagar(i){db[mes.value][i].p=!db[mes.value][i].p;render()}function excluir(i){if(confirm('Excluir esta conta?')){db[mes.value].splice(i,1);render()}}function copiar(){let m=+mes.value;if(m>1){db[m]=(db[m-1]||[]).map(x=>({...x,p:false}));render()}}mes.onchange=render;render();</script></body></html>
